# =====================================================================
#  MySQL settings - used when the app runs with the "mysql" profile.
#  The database "credchain" is created automatically on first start.
#
#  The app uses its own MySQL user "credchain" that can ONLY access the
#  credchain database (least privilege - it is not the root account).
#  Create it once in MySQL (as root):
#    CREATE DATABASE IF NOT EXISTS credchain;
#    CREATE USER IF NOT EXISTS 'credchain'@'localhost' IDENTIFIED BY 'credchain123';
#    GRANT ALL PRIVILEGES ON credchain.* TO 'credchain'@'localhost';
#    FLUSH PRIVILEGES;
#
#  To use other values, set environment variables MYSQL_USER / MYSQL_PASSWORD.
# =====================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/credchain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:credchain}
spring.datasource.password=${MYSQL_PASSWORD:credchain123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create/update tables automatically
spring.jpa.hibernate.ddl-auto=update

# The H2 web console is not used with MySQL
spring.h2.console.enabled=false
