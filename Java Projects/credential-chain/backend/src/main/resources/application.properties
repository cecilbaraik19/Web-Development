spring.application.name=credential-chain
server.port=8080

# ---- Database: H2 file DB (data survives restarts in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/credchain;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL: run with the "mysql" profile (see application-mysql.properties) ----
# IntelliJ: Run > Edit Configurations > Active profiles: mysql
# Terminal: mvn spring-boot:run -Dspring-boot.run.profiles=mysql

# ---- Blockchain settings ----
# Number of leading zeros required in a block hash (4 = fast, 5 = a few seconds)
credchain.difficulty=4
# Automatically mine pending transactions every N ms
credchain.auto-mine=true
credchain.auto-mine-interval-ms=30000
# Seed a demo institution + credentials on first run
credchain.seed-demo-data=true
credchain.demo-api-key=demo-issuer-key

# ---- Login & security ----
# Secret used to sign login tokens (JWT). Leave empty to generate a random one at startup
# (everyone is signed out when the app restarts). Set a long random value in production.
credchain.jwt-secret=${CREDCHAIN_JWT_SECRET:}
credchain.jwt-ttl-hours=8
# Admin account created on first start (change the password for real use!)
credchain.admin-email=admin@credchain.local
credchain.admin-password=admin123
# Login for the seeded demo institution
credchain.demo-issuer-email=registrar@demo-institute.edu
credchain.demo-issuer-password=demo123
