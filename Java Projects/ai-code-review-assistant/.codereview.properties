# AI Code Review Assistant - settings
# Put this file in the folder you review (or pass it with --config).
# Every line is optional; delete a line to use the default.

# Limits
max.method.lines=50
max.complexity=10
max.parameters=5
max.line.length=120
max.nesting=4
max.class.lines=500
duplicate.block.lines=6

# Hide issues below this level: CRITICAL, MAJOR, MINOR or INFO
min.severity=INFO

# Exit with code 2 (fail the build) if any issue is at this level or above
# fail.on=CRITICAL

# Turn rules off (comma separated ids, see --list-rules)
disabled.rules=

# Change the severity of a single rule
# severity.MAGIC_NUMBER=MINOR

# Which file types to review
include.extensions=java,js,ts,py
