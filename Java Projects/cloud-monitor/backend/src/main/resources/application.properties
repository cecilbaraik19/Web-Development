spring.application.name=cloud-monitor
server.port=8080
server.error.include-message=always

# ---------- Database: MySQL (data is saved permanently) ----------
# The database "cloudmonitor" is created automatically on first start.
# Password can also be given as an environment variable DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/cloudmonitor?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root123}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false

# ---------- Database: H2 (in-memory, resets on every restart) ----------
# To go back to H2: comment out the MySQL block above and uncomment these lines.
#spring.datasource.url=jdbc:h2:mem:cloudmonitor;DB_CLOSE_DELAY=-1
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ---------- Security ----------
# Base64 key for signing JWTs. Change it before deploying anywhere public.
app.jwt.secret=Eu3d/ZE11U/9TwleSr8pvXc2VbRMol/TooGtmFcXOwbyTCW+Tbyh2G6HnC/0/lJE
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=http://localhost:5173

# ---------- Monitoring ----------
# How often metrics are collected and pushed to the dashboard
app.monitor.tick-ms=3000
# Save a history point every N ticks (5 x 3s = every 15s)
app.monitor.persist-every=5
# How long to keep history
app.monitor.retention-hours=24

# ---------- Costs ----------
# Default monthly budget in USD (admins can change it on the Costs page)
app.cost.monthly-budget=3000

# ---------- Email alerts (Gmail) ----------
# Never write the password here. Set these two environment variables in IntelliJ instead:
#   MAIL_USERNAME = your Gmail address
#   MAIL_PASSWORD = a 16-character Gmail "App password"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Safety limit so a burst of alerts can't flood the inbox
app.mail.max-per-hour=20
# Link used in emails to open the dashboard
app.public-url=http://localhost:5173
