spring.application.name=cloud-monitor
server.port=8080
server.error.include-message=always

# ---------- Database: H2 (in-memory, zero setup) ----------
spring.datasource.url=jdbc:h2:mem:cloudmonitor;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Database: MySQL (uncomment these, comment out the H2 block above) ----------
#spring.datasource.url=jdbc:mysql://localhost:3306/cloudmonitor?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ---------- Security ----------
# Base64 key for signing JWTs. Change it before deploying anywhere public.
app.jwt.secret=Eu3d/ZE11U/9TwleSr8pvXc2VbRMol/TooGtmFcXOwbyTCW+Tbyh2G6HnC/0/lJE
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=http://localhost:5173

# ---------- Monitoring ----------
# How often metrics are collected and pushed to the dashboard
app.monitor.tick-ms=3000
# Save a history point every N ticks (5 x 3s = every 15s)
app.monitor.persist-every=5
# How long to keep history
app.monitor.retention-hours=24
