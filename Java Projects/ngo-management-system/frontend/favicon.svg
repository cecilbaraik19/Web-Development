      <circle cx="9" cy="20" r="5.2"/><circle cx="12.2" cy="12.2" r="5.2"/>
    </g>
    <circle cx="20" cy="20" r="8.5" fill="#e8590c"/>
    <circle cx="20" cy="20" r="4" fill="#ffd43b"/>
