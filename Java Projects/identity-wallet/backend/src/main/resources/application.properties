spring.application.name=identity-wallet
server.port=8080

# ---- Database: H2 file DB (data survives restarts in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/idwallet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL: run with the "mysql" profile (see application-mysql.properties) ----
# IntelliJ: Run > Edit Configurations > Active profiles: mysql
# Terminal: mvn spring-boot:run -Dspring-boot.run.profiles=mysql

# ---- Uploads (vault documents) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Encryption ----
# 256-bit master key (Base64) that encrypts every user's data key and every private key.
# Leave empty to create ./data/master.key on first start. KEEP THAT FILE SAFE: without it
# the encrypted vault and keys cannot be decrypted. In production, inject it from an env var:
#   IDWALLET_MASTER_KEY=<base64>
idwallet.master-key=${IDWALLET_MASTER_KEY:}
idwallet.master-key-file=./data/master.key

# ---- Login & security ----
# Secret used to sign login tokens (JWT). Empty = random at startup (everyone is signed out on restart).
idwallet.jwt-secret=
idwallet.jwt-ttl-minutes=480
# Address the frontend is served from; used to build share links and QR codes
idwallet.public-url=http://localhost:5173

# Accounts created on first start (change these passwords for real use!)
idwallet.seed-demo-data=true
idwallet.admin-email=admin@idwallet.local
idwallet.admin-password=Admin@123
