# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Create the database first:  CREATE DATABASE idwallet;
spring.datasource.url=jdbc:mysql://localhost:3306/idwallet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
