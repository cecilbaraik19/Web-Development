# =====================================================================
#  Production profile:  SPRING_PROFILES_ACTIVE=prod
#  Everything secret comes from environment variables - never commit real values.
# =====================================================================

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:attendance}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# Creates/updates tables automatically. For a big production system you would switch to
# 'validate' plus a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---------- Hardening ----------
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
# Fail fast if the JWT signing key is missing (otherwise everyone is logged out on every restart)
attendance.jwt.require-secret=true
attendance.jwt.secret=${JWT_SECRET:}
# First admin password - set ADMIN_PASSWORD before the very first start
# (if empty, a random one is generated and printed once in the log)
attendance.security.initial-admin-password=${ADMIN_PASSWORD:}
# No fake employees in production unless you ask for them
attendance.seed-demo-data=${SEED_DEMO_DATA:false}

# Requests come through nginx in Docker: trust X-Forwarded-For only from the private Docker network
attendance.security.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1,::1,172.16.0.0/12}
attendance.cors-origins=${CORS_ORIGINS:http://localhost}

# Email alerts: emails are only logged until you set the environment variables
#   SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (Spring reads them automatically)
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
attendance.mail.from=${MAIL_FROM:AttendTrack <no-reply@attendtrack.local>}
attendance.alerts.admin-email=${ADMIN_EMAIL:}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
