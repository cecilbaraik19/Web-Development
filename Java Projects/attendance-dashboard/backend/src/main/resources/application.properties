spring.application.name=attendance-dashboard
server.port=8080

# ---------- H2 (default, file-based so data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/attendance-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MySQL (uncomment + add mysql-connector-j in pom.xml) ----------
#spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Office rules used to decide PRESENT vs LATE and HALF_DAY
attendance.office-start=09:30
attendance.late-grace-minutes=15
attendance.half-day-hours=4.5
# Normal working hours per day for staff without a shift; more counts as overtime
attendance.standard-hours=8
# Days excluded from trends/reports (add SATURDAY removal if your office works Saturdays)
attendance.weekend-days=SATURDAY,SUNDAY
# Seed demo employees + 30 days of history on first run
attendance.seed-demo-data=true
# ---------- Security ----------
# JWT signing key: set the JWT_SECRET environment variable (32+ characters, or base64 of 32+ bytes).
# If empty, a random key is generated at startup (everyone is logged out on restart).
attendance.jwt.secret=${JWT_SECRET:}
attendance.jwt.expiration-minutes=480
# Lock an account for 15 minutes after 5 wrong passwords
attendance.security.max-failed-logins=5
attendance.security.lock-minutes=15
# Password for the 'admin' account created on first run (change it after logging in!)
attendance.security.initial-admin-password=${ADMIN_PASSWORD:Admin@123}

# Proxies allowed to set X-Forwarded-For (the Vite dev server / nginx on this machine).
# Requests from anywhere else can't fake their IP with that header.
attendance.security.trusted-proxies=127.0.0.1,::1

# ---------- Alerts & email ----------
# Scheduled alerts (cron: sec min hour day month weekday). Times are server local time.
attendance.alerts.enabled=true
attendance.alerts.missing-checkin-cron=0 30 10 * * MON-FRI
attendance.alerts.weekly-summary-cron=0 0 9 * * MON
# Company-wide weekly summary goes here (optional)
attendance.alerts.admin-email=
# A late-arrival pattern is flagged at this many late days in the period
attendance.alerts.late-threshold=3
# Without SMTP settings, emails are only written to the Notifications log (Admin > Notifications).
# To really send (e.g. Gmail with an App Password), set these - preferably as environment variables:
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
attendance.mail.from=AttendTrack <no-reply@attendtrack.local>

# Allowed frontend origin(s)
attendance.cors-origins=http://localhost:5173
