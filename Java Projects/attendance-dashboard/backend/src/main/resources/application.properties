spring.application.name=attendance-dashboard
server.port=8080

# ---------- H2 (default, file-based so data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/attendance-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MySQL (uncomment + add mysql-connector-j in pom.xml) ----------
#spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Office rules used to decide PRESENT vs LATE and HALF_DAY
attendance.office-start=09:30
attendance.late-grace-minutes=15
attendance.half-day-hours=4.5
# Days excluded from trends/reports (add SATURDAY removal if your office works Saturdays)
attendance.weekend-days=SATURDAY,SUNDAY
# Seed demo employees + 30 days of history on first run
attendance.seed-demo-data=true
# ---------- Security ----------
# JWT signing key: set the JWT_SECRET environment variable (32+ characters, or base64 of 32+ bytes).
# If empty, a random key is generated at startup (everyone is logged out on restart).
attendance.jwt.secret=${JWT_SECRET:}
attendance.jwt.expiration-minutes=480
# Lock an account for 15 minutes after 5 wrong passwords
attendance.security.max-failed-logins=5
attendance.security.lock-minutes=15
# Password for the 'admin' account created on first run (change it after logging in!)
attendance.security.initial-admin-password=${ADMIN_PASSWORD:Admin@123}

# Allowed frontend origin(s)
attendance.cors-origins=http://localhost:5173
