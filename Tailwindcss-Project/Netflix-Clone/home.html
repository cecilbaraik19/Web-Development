<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix | Home Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Banner Section -->
     <section class="w-[100%] h-[100vh] bg-[url('images/homePage.jpg')] bg-center bg-cover">
        <div class="w-[100%] h-[100vh] bg-[rgba(0,0,0,0.5)]">
            <header class="max-w-[1170px] mx-auto">
                <div class="grid sm:grid-cols-2 grid-cols-[30%_auto] p-10 items-center">
                    <figure>
                        <img src="https://occ.a.nflxso.net/dnmt/api/v6/iL4oJVDYZ8KLSrJ6eG2OwtghbfQ/AAAAAVvRDRqBcLS7fk0Qpns6gQSS3VdMMYtpN_ba4Nzu63yuVrE7JHt-MdKCNAQnJ8SrsPBqivurwF6ugwnAa54jBGNohFD6CNLHDjwQUnPO_cKrHSqgmLOAw0zUe2dRClJd4cchXguY1Bjj.svg" alt="" class="w-[148px]">
                    </figure>
                    <div class="flex justify-end gap-[10px]">
                        <div class="relative">
                            
                            <select name="" id="" class="bg-[black] text-white border-[1px] border-[white] sm:p-[5px_25px] p-[5px_20px] rounded-[5px]">
                                <option value="">English</option>
                                <option value="">Hindi</option>
                            </select>
                        </div>
                        <button class="bg-[red] px-[10px] rounded-[5px] text-white">
                            Sign In
                        </button>
                    </div>
                </div>
            </header>
            <div class="max-w-[1170px] mx-auto sm:py-[150px] py-[50px] text-center">
                <h1 class="sm:text-[50px] text-[35px] text-white font-bold">Unlimited movie, TV shows and more </h1>
                <h4 class="text-white py-[15px] text-[25px]">Watch anywhere. Cancel anytime.</h4>
                <p class="text-white text-[20px]">Ready to watch? Enter your email to create or restart yout membership.</p>
                <div class="max-w-[700px] sm:px-[10px] px-[40px] mx-auto mt-[30px]">
                    <form action="" class="grid gap-[20px] sm:grid-cols-[70%_auto]" sm:grid-cols-1>
                        <input type="text" class="text-white border-[1px] pl-[20px] h-[50px] border-[#ccc] bg-[transparent]" placeholder="Email Address">
                        <button class="bg-[red] px-[10px] rounded-[5px] py-[10px] text-white hover:bg-[rgb(193,17,25)] duration-300 text-[20px]">Get Started ></button>
                    </form>
                </div>
            </div>
        </div>
     </section>
     <!-- Frequently Ask Questions Section-->
      <section class="w-[100%] bg-[black] border-t-[8px] border-t-[#605d5d] sm:py-[80px] py-[50px]">
            <div class="max-w-[1170px] mx-auto px-[15px]">
                <h2 class="sm:text-[50px] text=[40px] font-bold text-white text-center">Frequently Asked Questions</h2>
            </div>
      </section>
</body>
</html>
